<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 18 de Clase de Desarrollo</title>
    <!-- Tailwind CSS v3 via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Tarjeta principal -->
    <div class="max-w-sm w-full bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700 transition-all hover:scale-105 duration-300">
        
        <!-- Imagen superior / Portada -->
        <div class="h-32 bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-center">
            <span class="text-4xl font-black text-white/20 tracking-widest uppercase">Tarea 18</span>
        </div>

        <!-- Contenido de la tarjeta -->
        <div class="p-6 relative">
            <!-- Insignia / Badge -->
            <span class="absolute -top-4 right-6 bg-blue-500 text-xs font-semibold px-3 py-1 rounded-full shadow-lg">
                Desarrollo Web
            </span>

            <h1 class="text-2xl font-bold text-white mb-2">
                ¡GitHub. Tarea!
            </h1>

            <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                Esta es una página de prueba hecha con IA para la tarea de la clase 18 de desarrollo web, en donde probamos la plataforma de <b>GitHub.</b>
            </p>

            <!-- Botón de acción -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-700">
                <span class="text-xs text-slate-500">Estado: Completado</span>
                <button class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors shadow-md">
                    Explorar
                </button>
            </div>
        </div>

    </div>

</body>
</html>
